# Publishes the package to npm when a GitHub release is published.
# npm trusted publishing (OIDC), staged: no npm token is stored in GitHub; every version is
# approved with 2FA on npmjs.com. See PUBLISHING.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # GitHub issues the OIDC token that npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing works only on GitHub-hosted runners
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm CLI 11.5.1 or newer, `npm stage publish` npm 12
      - run: npm install -g npm@^12

      - name: Check that the tag matches package.json and src/version.ts
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
          SRC=$(node -e "const m=require('fs').readFileSync('src/version.ts','utf8').match(/VERSION = \"([^\"]+)\"/); console.log(m && m[1])")
          if [ "$SRC" != "$VERSION" ]; then
            echo "::error::src/version.ts ($SRC) does not match package.json ($VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

      - name: Stage the release on npm
        # a maintainer approves every version with 2FA at npmjs.com → Staged Packages.
        # Trusted publishing (OIDC) is used once it is configured; for the very first version
        # (the package does not exist yet) npm falls back to the temporary NPM_BOOTSTRAP_TOKEN
        # secret – delete it right after 0.1.0 is approved. See PUBLISHING.md.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          npm stage publish --provenance --access public --tag "$TAG"
          echo "::notice::@wbx-sandbox/mastra $VERSION is staged – approve it at https://www.npmjs.com → Staged Packages"
